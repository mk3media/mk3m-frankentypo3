name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
      placeholder: When running `docker compose up -d`, service X fails with...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Clone repository
        2. Set .env variable X to Y
        3. Run `make up`
        4. See error
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon - arm64)
        - macOS (Intel - x86_64)
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora / RHEL)
        - Windows (WSL2)
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Provide versions of Docker, Docker Compose, and TYPO3.
      placeholder: Docker 27.x, Compose v2.29, TYPO3 13.4.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Container Logs
      description: Paste any relevant output from `make logs` or `docker compose logs`.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have verified that my `.env` file does not leak sensitive private keys or passwords in the log excerpt.
          required: true
